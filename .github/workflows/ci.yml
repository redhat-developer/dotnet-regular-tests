name: Confirm tests run successfully

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Verify tests pass

    runs-on: ubuntu-latest

    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        container_image:
          - quay.io/centos/centos:stream9
          - quay.io/centos/centos:stream10
          - registry.fedoraproject.org/fedora:43
          - registry.fedoraproject.org/fedora:44
          - registry.fedoraproject.org/fedora:45
          - registry.fedoraproject.org/fedora:rawhide
          - registry.access.redhat.com/ubi8
          - registry.access.redhat.com/ubi9
          - registry.access.redhat.com/ubi10
        dotnet_version:
          - "11.0"
        # Preview .NET versions are available via the @dotnet-sig/dotnet-preview copr repo.
        # Each year, add include entries for the new preview version (fedora:latest + rawhide)
        # with use_preview_copr: true. When a version ships officially, move dotnet_version
        # into the main list above and remove its include entries (and this block if empty).

    container:
      image: ${{ matrix.container_image }}
      options: --security-opt seccomp=unconfined

    steps:
      - uses: actions/checkout@v7

      - name: Install .NET ${{ matrix.dotnet_version }}
        # .NET 9 introduced the 'dotnet-sdk-aot' package
        # .NET 8 introduced the 'dbg' packages
        # '/etc/os-release' will also match the grep fedora for Fedora derived systems, such as CentOS.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          cat /etc/os-release
          if grep fedora /etc/os-release; then
            if [[ "${{ matrix.use_preview_copr }}" == "true" ]]; then
              dnf install 'dnf-command(copr)' -y
              if grep centos /etc/os-release; then
                dnf copr enable @dotnet-sig/dotnet-preview centos-stream-10-x86_64 -y
              else
                dnf copr enable @dotnet-sig/dotnet-preview -y
              fi
            fi
            dnf install -y dotnet-sdk-${{ matrix.dotnet_version }}
            dnf install -y \
              dotnet-sdk-dbg-${{ matrix.dotnet_version }} \
              dotnet-runtime-dbg-${{ matrix.dotnet_version }} \
              aspnetcore-runtime-dbg-${{ matrix.dotnet_version }}
            if [[ ${{ matrix.dotnet_version }} != 8.* ]]; then
              dnf install -y dotnet-sdk-aot-${{ matrix.dotnet_version }}
            fi
          elif grep alpine /etc/os-release; then
            if grep edge /etc/os-release; then
              echo "https://dl-cdn.alpinelinux.org/alpine/edge/testing" >> /etc/apk/repositories
            fi
            apk upgrade -a
            apk add dotnet-sdk-${{ matrix.dotnet_version }} dotnet-doc
            apk add \
              dotnet-sdk-dbg-${{ matrix.dotnet_version }} \
              dotnet-runtime-dbg-${{ matrix.dotnet_version }} \
              aspnetcore-runtime-dbg-${{ matrix.dotnet_version }}
            if [[ ${{ matrix.dotnet_version }} != 8.* ]]; then
              apk add dotnet-sdk-aot-${{ matrix.dotnet_version }}
            fi
          fi
          dotnet --info

      - name: Install Test dependencies
        timeout-minutes: 5
        run: |
          if grep fedora /etc/os-release ; then
            dnf install -y $(grep '^Dependencies(dnf): ' README.md | cut -d: -f2-) --skip-broken
          elif grep alpine /etc/os-release; then
            apk add $(grep '^Dependencies(apk): ' README.md | cut -d: -f2-)
            echo -e '[PostgreSQL]\nDescription=PostgreSQL Unicode\nDriver=/usr/lib/psqlodbcw.so\nUsageCount=1' > /etc/odbcinst.ini
          fi

      - name: Download test runner
        run: |
          set -euo pipefail
          wget --no-verbose https://github.com/redhat-developer/dotnet-bunny/releases/latest/download/turkey.tar.gz
          tar xf turkey.tar.gz

      - name: Run tests
        run: |
          set -euo pipefail

          id
          echo "HOME: $HOME"
          echo "XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-(unset)}"
          ls -al $HOME
          find $HOME/.dotnet

          trait_flags=()

          if [[ ${{ matrix.container_image }} == *ubi8 ]] ; then
              trait_flags+=( --trait ubi8-repos )
          fi
          if [[ ${{ matrix.container_image }} == *ubi9 ]] ; then
              trait_flags+=( --trait ubi9-repos )
          fi
          if [[ ${{ matrix.container_image }} == *ubi10 ]] ; then
              trait_flags+=( --trait ubi10-repos )
          fi

          mkdir -p /tmp/dotnet-diag
          dotnet turkey/Turkey.dll -v --timeout 600 --trait github-ci "${trait_flags[@]}" --log-directory /tmp/dotnet-diag/
        shell: bash
        env:
          # 1. Host & CLI resolution traces
          DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER: "true"
          #DOTNET_CLI_USE_MSBUILD_SERVER: "false"
          # 2. MSBuild out-of-proc node & scheduler logs
          MSBUILDDEBUGENGINE: "1"
          MSBUILDDEBUGPATH: "/tmp/dotnet-diag"
          # 3. Runtime crash dumps & JSON stack reports
          DOTNET_DbgEnableMiniDump: "1"
          DOTNET_DbgMiniDumpType: "1"
          DOTNET_DbgMiniDumpName: "/tmp/dotnet-diag/coredump.%e.%p.%t.dmp"
          DOTNET_EnableCrashReport: "1"
          DOTNET_CreateDumpDiagnostics: "1"

      - name: Upload .NET diagnostic logs and dumps
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-11-diagnostics
          path: /tmp/dotnet-diag/
          if-no-files-found: warn
